name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore Loren.slnx

      - name: Build
        run: dotnet build Loren.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Loren.slnx --configuration Release --no-build --no-restore

      - name: Format
        run: dotnet format Loren.slnx --verify-no-changes --no-restore

      - name: Basic secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- .; then
            echo 'Potential secret material found in tracked files.'
            exit 1
          fi

      - name: Dependency vulnerability scan
        run: dotnet package list --project Loren.slnx --vulnerable --include-transitive

      - name: Web health, auth, and default-surface smoke test
        shell: bash
        run: |
          set -euo pipefail
          LOREN_OWNER_PASSWORD='ci-owner-password' dotnet run --project src/Loren.Web/Loren.Web.csproj \
            --configuration Release --no-build --urls http://127.0.0.1:5091 \
            > /tmp/loren-web.log 2>&1 &
          pid=$!
          trap 'cat /tmp/loren-web.log || true; kill "$pid" 2>/dev/null || true' EXIT

          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5091/health | grep -q '"status":"ok"'; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo 'Loren web health check did not become ready.'
            exit 1
          fi

          root_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5091/)"
          if [[ "$root_status" != "302" ]]; then
            echo "Unauthenticated owner console must redirect to login; got HTTP $root_status."
            exit 1
          fi

          api_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"message":"should not run"}' \
            http://127.0.0.1:5091/api/run)"
          if [[ "$api_status" != "401" ]]; then
            echo "Unauthenticated API request must be rejected; got HTTP $api_status."
            exit 1
          fi

          wrong_login_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"password":"wrong"}' \
            http://127.0.0.1:5091/auth/login)"
          if [[ "$wrong_login_status" != "401" ]]; then
            echo "Wrong owner password must be rejected; got HTTP $wrong_login_status."
            exit 1
          fi

          login_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -c /tmp/loren-owner.cookies \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci-owner-password"}' \
            http://127.0.0.1:5091/auth/login)"
          if [[ "$login_status" != "200" ]]; then
            echo "Owner login failed; got HTTP $login_status."
            exit 1
          fi

          if ! curl -fsS -b /tmp/loren-owner.cookies http://127.0.0.1:5091/ \
            | grep -q 'Loren owner console'; then
            echo 'Authenticated owner console did not render.'
            exit 1
          fi

          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5091/internal/dev/run)"
          if [[ "$status" != "404" ]]; then
            echo "Development run endpoint must be absent by default; got HTTP $status."
            exit 1
          fi

  windows-integration:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore Loren.slnx

      - name: Windows integration tests
        run: dotnet test tests/Loren.IntegrationTests/Loren.IntegrationTests.csproj --configuration Release --no-restore
