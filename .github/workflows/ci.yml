name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore Loren.slnx

      - name: Build
        run: dotnet build Loren.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Loren.slnx --configuration Release --no-build --no-restore

      - name: Format
        run: dotnet format Loren.slnx --verify-no-changes --no-restore

      - name: Basic secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- .; then
            echo 'Potential secret material found in tracked files.'
            exit 1
          fi

      - name: Dependency vulnerability scan
        run: dotnet package list --project Loren.slnx --vulnerable --include-transitive

      - name: Web health smoke test
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Loren.Web/Loren.Web.csproj \
            --configuration Release --no-build --urls http://127.0.0.1:5091 \
            > /tmp/loren-web.log 2>&1 &
          pid=$!
          trap 'cat /tmp/loren-web.log || true; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5091/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo 'Loren web health check did not become ready.'
          exit 1
